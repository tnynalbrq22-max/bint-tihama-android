
name: Build Bint Tihama APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Bint_Tihama_Android_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o Bint_Tihama_Android_Project.zip -d .

      - name: Build APK
        working-directory: bint_tihama_android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bint-tihama-apk
          path: bint_tihama_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
